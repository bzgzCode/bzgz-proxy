 view(`<div class="card"><h3>${t('useT')}</h3><div class="grid"><div class="kpi"><b>${n(rq)}</b><small>${t('tReq')}</small></div><div class="kpi"><b>${fB(by)}</b><small>${t('tTraf')}</small></div></div></div>`+
 P.map(p=>{const mx=Math.max(1,...p.spark),[sc,sk]=ST(p),L=`P.find(x=>x.id=='${p.id}').enter`;return `<div class="card pc ${p.off?'paused':''}"><h3>${esc(p.name)}<span class="badge ${sc}">${t(sk)}</span></h3><div class="seen">${t('seenL')}: ${rel(p.seen)}</div><div class="url">${esc(p.enter)}</div>
 <div class="grid"><div class="kpi"><b>${n(p.today.req)}</b><small>${t('today')} · ${t('of')}</small></div><div class="kpi"><b>${fB(p.today.bytes)}</b><small>${t('week')}: ${fB(p.week)}</small></div></div>
 <div class="spark">${p.spark.map(v=>`<i style="height:${Math.max(10,v/mx*100)}%"></i>`).join('')}</div>
 ${p.off?`<p class="pn">${t('pausedNote')}</p>`:`<button class="btn p" style="margin-top:14px;padding:14px;font-size:14.5px" onclick="openTg(${L})">${t('addTg')}</button>`}
 <div class="ag">${ab(`cp(${L})`,'📋','aCopy','hCopy')}${ab(`shareLink(${L})`,'📤','aShare','hShare')}${ab(`ren('${p.id}')`,'✏️','aRen','hRen')}${ab(`tok('update','${p.id}')`,'⬆️','aUpd','hUpd')}${ab(`tok('rotate','${p.id}')`,'🔄','aRot','hRot','w')}${p.off?ab(`tok('resume','${p.id}')`,'▶️','aRes','hRes'):ab(`tok('pause','${p.id}')`,'⏸','aPause','hPause','w')}${ab(`delM('${p.id}')`,'🗑️','aDel','hDel','d')}</div></div>`}).join('')+dlCard())}
function ren(id){const p=P.find(x=>x.id==id);modal(`<h3>${t('renT')}</h3><input id="rn" value="${esc(p.name)}" maxlength="24"><button class="btn p" onclick="go(async()=>{await api('rename',{id:'${id}',name:$('#rn').value});closeM();rUse()})">${t('save')}</button>`)}
const TA={update:{r:'update',T:'updT',W:'tokNote'},rotate:{r:'rotate',T:'rotT',W:'rotW'},pause:{r:'power',x:{on:false},T:'pauseT',W:'pauseW'},resume:{r:'power',x:{on:true},T:'resumeT',W:'resumeW'},delete:{r:'delete',T:'delT',W:'tokNote'}};
function tok(act,id){const a=TA[act];modal(`<h3>${t(a.T)}</h3><p style="color:var(--m);font-size:13.5px;line-height:1.9">${t(a.W)}</p><p class="hint">${t('tokNote')}</p><button class="btn" style="margin-top:10px;width:100%" onclick="openLk(TOKEN_URL)">🔑 ${t('getTok')}</button><input class="l" id="tk" type="password" placeholder="${t('tok')}" autocomplete="off" style="margin-top:10px"><input class="l" id="ta" placeholder="${t('acc')} (${t('accL').match(/\((.*)\)/)?.[1]||''})" autocomplete="off" style="margin-top:10px"><button class="btn p" id="tb" onclick="doTok('${act}','${id}')">${t('ok')}</button>`)}
async function doTok(act,id){const b=$('#tb'),a=TA[act];b.disabled=true;await go(async()=>{await api(a.r,{id,account:$('#ta').value,token:$('#tk').value,...a.x});closeM();toast(t('doneT'));rUse()});b.disabled=false}
function delM(id){modal(`<h3>${t('rmT')}</h3><p style="color:var(--m);font-size:13.5px;line-height:1.9">${t('rmB')}</p><button class="btn p" onclick="go(async()=>{await api('delete',{id:'${id}'});closeM();rUse()})">${t('rmL')}</button><button class="btn p" style="background:var(--bad);box-shadow:none" onclick="tok('delete','${id}')">${t('rmF')}</button>`)}

/* ---------- guide ---------- */
async function rGuide(){view(`<div class="card"><h3>${t('gT')}</h3><ol class="st"><li>${t('g1')}</li><li>${t('g2')}</li><li>${t('g3')}</li><li>${t('g4')}</li></ol></div>
 <div class="card"><h3>${t('fq')}</h3>${[1,2,3,4].map(i=>`<details><summary>${t('q'+i)}</summary><p>${t('a'+i)}</p></details>`).join('')}</div>`+dlCard())}

/* ---------- support ---------- */
async function rSup(){const r=await api('tickets');view(`<div class="card"><h3>🆘 ${t('supT')}</h3><textarea id="st" placeholder="${t('supPh')}"></textarea><button class="btn p" onclick="newT()">${t('send')}</button></div>`+
 (r.tickets.length?`<div class="card"><h3>${t('myT')}</h3>`+r.tickets.map(x=>`<div class="row" onclick="thread(${x.id},false)" style="cursor:pointer"><span>#${x.id} ${esc(x.subject)}</span><span>${x.status=='open'?'🟢':'⚪'}</span></div>`).join('')+'</div>':''))}
async function newT(){await go(async()=>{await api('tnew',{text:$('#st').value});toast(t('sentT'));rSup()})}
async function thread(id,adm){await go(async()=>{const r=await api('ticket',{id,admin:adm}),f=adm?'a_reply':'tnew';
 modal(`<h3>#${id} ${esc(r.ticket.subject)}</h3>`+r.msgs.map(m=>`<div class="msg ${m.admin?'a':'u'}">${esc(m.text)}<br><small style="opacity:.55">${fD(m.ts)}</small></div>`).join('')+
 `<textarea id="rp" placeholder="${t('msgPh')}"></textarea><button class="btn p" onclick="go(async()=>{await api('${f}',{id:${id},text:$('#rp').value});toast(t('sentT'));thread(${id},${adm})})">${t('send')}</button>`+
 (adm?`<div class="acts"><button class="btn s" onclick="go(async()=>{await api('a_close',{id:${id},open:${r.ticket.status!='open'}});closeM();AC='tickets';rAdmin()})">${r.ticket.status=='open'?t('closeT'):t('reopen')}</button></div>`:''))})}

/* ---------- me ---------- */
async function rMe(){const u=S.user;view(`<div class="card" style="text-align:center"><div class="logo" style="width:72px;height:72px;font-size:32px;margin:0 auto 12px">${esc((u.name||'?')[0])}</div><h3 style="justify-content:center;margin:0">${esc(u.name)}</h3><p style="color:var(--m);margin:6px 0 0">ID ${u.id} · ${t('joined')} ${fD(u.joined)}</p></div>
 <div class="card"><div class="row"><span>🔔 ${t('notif')}</span><input type="checkbox" id="nt" style="width:22px;height:22px;margin:0" ${u.notify?'checked':''} onchange="api('settings',{notify:this.checked}).then(()=>toast(t('doneT')))"></div></div>`+
 (u.role!='user'?`<button class="btn p" onclick="show('admin')">🛠️ ${t('adm')}</button>`:''))}

/* ---------- admin ---------- */
async function rAdmin(){const T=[['stats',t('aS')],['users',t('aU')],['tickets',t('aT')]];if(S.user.role=='owner')T.push(['settings',t('aG')]);
 view(`<div class="tg">${T.map(x=>`<span class="pill ${x[0]==AC?'on':''}" onclick="AC='${x[0]}';rAdmin()">${x[1]}</span>`).join('')}</div><div id="ab"></div>`);await A[AC]()}
const A={
 async stats(){const r=await api('a_stats'),s=r.stats,mx=Math.max(1,...r.spark.map(x=>x.b));
  $('#ab').innerHTML=`<div class="grid"><div class="kpi"><b>${n(s.users)}</b><small>${t('kU')}</small></div><div class="kpi"><b>+${n(s.newToday)}</b><small>${t('kN')}</small></div><div class="kpi"><b>${n(s.active24)}</b><small>${t('kA')}</small></div><div class="kpi"><b>${n(s.proxies)}</b><small>${t('kP')} (${n(s.down)} ${t('kD')})</small></div><div class="kpi"><b>${n(s.req)}</b><small>${t('tReq')}</small></div><div class="kpi"><b>${fB(s.bytes)}</b><small>${t('tTraf')}</small></div></div>
  <div class="card" style="margin-top:14px"><h3>${t('d14')}</h3><div class="spark" style="height:70px">${r.spark.map(x=>`<i style="height:${Math.max(10,x.b/mx*100)}%"></i>`).join('')}</div></div>
  <div class="card"><h3>🏆 ${t('top')}</h3>${r.top.map(x=>`<div class="row" onclick="auser(${x.id})" style="cursor:pointer"><span>${esc(x.name)}</span><span>${fB(x.b)}</span></div>`).join('')||'<p>—</p>'}</div>`},
 async users(){$('#ab').innerHTML=`<div class="card"><input id="uq" placeholder="${t('sr')}"><button class="btn p" onclick="go(ulist)">${t('go')}</button></div>
  <div class="card"><h3>${t('addU')}</h3><input class="l" id="nid" placeholder="${t('idPh')}"><button class="btn p" onclick="go(async()=>{await api('a_adduser',{id:$('#nid').value});toast(t('doneT'));ulist()})">${t('save')}</button></div><div id="ul"></div>`;await ulist()},
 async tickets(f='open'){const r=await api('a_tickets',{f});$('#ab').innerHTML=`<div class="tg"><span class="pill ${f=='open'?'on':''}" onclick="A.tickets('open')">${t('open')}</span><span class="pill ${f=='closed'?'on':''}" onclick="A.tickets('closed')">${t('closed')}</span></div><div class="card">`+(r.tickets.map(x=>`<div class="row" onclick="thread(${x.id},true)" style="cursor:pointer"><span>#${x.id} ${esc(x.name)}: ${esc(x.subject)}</span><span>${fD(x.upd)}</span></div>`).join('')||`<p style="color:var(--m)">${t('noT')}</p>`)+'</div>'},
 async settings(){const [ad,ch]=await Promise.all([api('a_admins'),api('a_channels')]);
  $('#ab').innerHTML=`<div class="card"><h3>👮 ${t('admins')}</h3>${ad.admins.map(a=>`<div class="row"><span>${esc(a.name)} <code>${a.id}</code></span><button class="btn s d" onclick="go(async()=>{await api('a_rmadmin',{id:${a.id}});A.settings()})">✕</button></div>`).join('')}
   <input class="l" id="aid" placeholder="${t('aIdPh')}" style="margin-top:10px"><button class="btn p" onclick="go(async()=>{await api('a_addadmin',{id:$('#aid').value});A.settings()})">${t('addA')}</button></div>
  <div class="card"><h3>🔒 ${t('fj')}</h3><div class="row" style="padding-top:0"><span><b>${t('lockL')}</b><br><small style="color:var(--m)">${t('lockD')}</small></span><label class="sw" style="margin:0"><input type="checkbox" ${ch.lock?'checked':''} onchange="go(async()=>{await api('a_fj',{on:this.checked});toast(t('doneT'))})"><i></i></label></div><p style="color:var(--m);font-size:13px">${t('fjD')}</p>${ch.channels.map(c=>`<div class="row"><span>${esc(c.title)} <code>${esc(c.id)}</code></span><button class="btn s d" onclick="go(async()=>{await api('a_rmch',{id:'${c.id}'});A.settings()})">✕</button></div>`).join('')}
   <input class="l" id="cid" placeholder="${t('chPh')}" style="margin-top:10px"><input class="l" id="clk" placeholder="${t('clk')}" style="margin-top:10px"><button class="btn p" onclick="go(async()=>{await api('a_addch',{id:$('#cid').value,link:$('#clk').value});A.settings()})">${t('addC')}</button></div>
  <div class="card"><h3>📣 ${t('bc')}</h3><textarea id="bc" placeholder="${t('bcPh')}"></textarea><button class="btn p" onclick="if(confirm(t('sure')))go(async()=>{await api('a_bc',{text:$('#bc').value});toast(t('queued'))})">${t('all')}</button></div>`}};
async function ulist(){const r=await api('a_users',{q:$('#uq')?.value||''});$('#ul').innerHTML='<div class="card">'+r.users.map(u=>`<div class="row" onclick="auser(${u.id})" style="cursor:pointer"><span>${u.banned?'⛔ ':''}${esc(u.name)} <code>${u.id}</code></span><span>${fD(u.joined)}</span></div>`).join('')+'</div>'}
async function auser(id){await go(async()=>{const r=await api('a_user',{id}),u=r.user;
 modal(`<h3>${esc(u.name)} <code>${u.id}</code></h3><p style="color:var(--m)">${t('joined')} ${fD(u.joined)} · ${t('kP')}: ${n(r.proxies.length)}</p>`+r.proxies.map(p=>`<div class="row"><span><i class="dot ${p.fail>=2?'bad':''}"></i>${esc(p.name)}</span><span>${fB(p.b30)} · ${n(p.r30)}</span></div>`).join('')+
 `<div class="acts"><button class="btn s ${u.banned?'':'d'}" onclick="go(async()=>{await api('a_ban',{id:${u.id},ban:${!u.banned}});closeM();toast(t('doneT'))})">${u.banned?t('unban'):t('ban')}</button></div>`)})}

/* ---------- boot ---------- */
(async()=>{applyLang();await go(async()=>{S=await api('me');if(I[S.user.lang]){LG=S.user.lang;applyLang()}
 if(S.join&&S.join.length)return rJoin(S.join);
 const h=location.hash.slice(1),al={create:'home',proxies:'use'},x=al[h]||h;show(R[x]?x:'home')})})();
